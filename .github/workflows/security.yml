name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, off the hour: new advisories land against an unchanged lockfile.
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  SEMGREP_VERSION: "1.184.0"
  PIP_AUDIT_VERSION: "2.10.1"
  GITLEAKS_VERSION: "8.30.1"
  # Checksum of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz (update with the version).
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Rule corpus passes
        run: uvx "semgrep==$SEMGREP_VERSION" --test --config .semgrep/rules .semgrep/tests --metrics=off --disable-version-check
      - name: Scan src and scripts
        # The repo's own invariant rules plus the standard Python/FastAPI packs.
        # One registry rule is excluded: it flags the log string "admin password
        # rotated for %s" on the word "password" alone (the call logs only an email).
        run: |
          uvx "semgrep==$SEMGREP_VERSION" \
            --config .semgrep/rules --config p/python --config p/fastapi \
            --exclude-rule python.lang.security.audit.logging.logger-credential-leak.python-logger-credential-disclosure \
            --error --metrics=off --disable-version-check \
            src scripts

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Export the lockfile (runtime dependencies)
        run: uv export --frozen --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
      - name: Audit pinned versions
        run: uvx "pip-audit==$PIP_AUDIT_VERSION" --no-deps --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan history, not just the tip
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full history
        run: '"$RUNNER_TEMP/gitleaks" detect --source . --redact --no-banner --exit-code 1'
