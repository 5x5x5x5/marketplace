{% extends "base.html" %}

{% block title %}Choose a new password — Marketplace{% endblock %}

{% block content %}
<section class="auth-form">
  <h1>Choose a new password</h1>
  {% if error %}
  <p class="form-error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="/password-reset/confirm">
    <input type="hidden" name="token" value="{{ token }}" />
    <label>
      New password
      <input
        type="password"
        name="new_password"
        required
        minlength="8"
        maxlength="128"
        autocomplete="new-password"
      />
    </label>
    <button type="submit" class="button">Set password</button>
  </form>
  <p class="field-hint">Changing your password logs you out everywhere.</p>
</section>
{% endblock %}
