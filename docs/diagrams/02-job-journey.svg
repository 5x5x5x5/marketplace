<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-label="Route map of one job. Two ways in, dispatch and browse, meet at the quote; then job posted, offer sent, accepted and paid, completed. Side branches show re-offering to the next seller, waiting for payment, expiry and cancellation.">
  <style>
    text{font-family:Georgia,'Noto Serif','Times New Roman',serif;fill:#23201b}
    .h{font-size:30px;font-weight:bold}
    .sub{font-size:16px;font-style:italic;fill:#7a7265}
    .l{font-size:16px}
    .s{font-size:13px;fill:#7a7265}
    .b{font-weight:bold}
    .m{font-family:'DejaVu Sans Mono',Menlo,Consolas,monospace;font-size:12px;fill:#7a7265}
    .st{fill:#f7f2e8;stroke:#23201b;stroke-width:3.5}
    .br{stroke:#a59c8a;stroke-width:4;fill:none}
    .end{fill:#a59c8a}
    .hot{stroke:#b4472a;stroke-width:8;stroke-linecap:round;fill:none}
  </style>
  <defs>
    <marker id="am" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a59c8a"/></marker>
  </defs>
  <rect width="1200" height="740" fill="#f7f2e8"/>

  <text x="60" y="70" class="h">The journey of one job</text>
  <text x="60" y="98" class="sub">Two ways in, one line. The heavy line is the trip everyone hopes for; the grey lines are the ways off it.</text>

  <!-- afterwards -->
  <line x1="1060" y1="245" x2="1060" y2="318" stroke="#a59c8a" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect x="905" y="150" width="250" height="95" rx="6" fill="#fffdf8" stroke="#a59c8a" stroke-width="1.5"/>
  <text x="921" y="175" class="b" font-size="15">Afterwards</text>
  <text x="921" y="196" class="s">Both sides can review each other.</text>
  <text x="921" y="214" class="s">The buyer has 7 days to open a</text>
  <text x="921" y="232" class="s">dispute (see the money diagram).</text>

  <!-- dead ends -->
  <line x1="478" y1="330" x2="478" y2="510" class="br"/>
  <line x1="690" y1="330" x2="690" y2="510" class="br"/>
  <line x1="940" y1="330" x2="940" y2="510" class="br"/>

  <!-- detour: waiting for payment -->
  <path d="M630 330C680 330 680 250 730 250C780 250 780 330 820 330" class="br"/>
  <circle cx="730" cy="250" r="8" fill="#f7f2e8" stroke="#a59c8a" stroke-width="3.5"/>
  <text x="735" y="166" text-anchor="middle" class="b" font-size="15">Waiting for payment</text>
  <text x="735" y="185" text-anchor="middle" class="s">if the card needs an extra step;</text>
  <text x="735" y="202" text-anchor="middle" class="s">the seller's slot is held, up to 30 min</text>
  <text x="735" y="222" text-anchor="middle" class="m">awaiting_payment</text>

  <!-- loop: next seller -->
  <path d="M556 316C506 236 634 236 586 312" class="br" marker-end="url(#am)"/>
  <text x="600" y="185" text-anchor="end" class="s">Declined, or no reply in 2 hours:</text>
  <text x="600" y="202" text-anchor="end" class="s">dispatch tries the next seller</text>

  <!-- two ways in -->
  <path d="M70 255C140 255 130 330 200 330" class="hot"/>
  <path d="M70 405C140 405 130 330 200 330" class="hot"/>
  <circle cx="70" cy="255" r="9" class="st"/>
  <circle cx="70" cy="405" r="9" class="st"/>
  <text x="50" y="185" class="l b">Dispatch</text>
  <text x="50" y="205" class="s">buyer asks for a kind of service;</text>
  <text x="50" y="222" class="s">the platform will pick the seller</text>
  <text x="50" y="438" class="l b">Browse</text>
  <text x="50" y="458" class="s">buyer picks a seller's listing;</text>
  <text x="50" y="475" class="s">the job is pinned to that seller</text>

  <!-- main line -->
  <line x1="200" y1="330" x2="1060" y2="330" class="hot"/>
  <circle cx="200" cy="330" r="12" class="st"/>
  <circle cx="390" cy="330" r="12" class="st"/>
  <circle cx="570" cy="330" r="12" class="st"/>
  <circle cx="820" cy="330" r="12" class="st"/>
  <circle cx="1060" cy="330" r="12" class="st"/>

  <text x="215" y="370" text-anchor="middle" class="l b">Quote</text>
  <text x="215" y="390" text-anchor="middle" class="m">quote</text>
  <text x="215" y="412" text-anchor="middle" class="s">A price, good for 15 min</text>

  <text x="390" y="370" text-anchor="middle" class="l b">Job posted</text>
  <text x="390" y="390" text-anchor="middle" class="m">pending</text>
  <text x="390" y="412" text-anchor="middle" class="s">Buyer books</text>

  <text x="570" y="370" text-anchor="middle" class="l b">Offer sent</text>
  <text x="570" y="390" text-anchor="middle" class="m">offered</text>
  <text x="570" y="412" text-anchor="middle" class="s">Seller is asked</text>

  <text x="820" y="370" text-anchor="middle" class="l b">Accepted and paid</text>
  <text x="820" y="390" text-anchor="middle" class="m">accepted</text>
  <text x="820" y="412" text-anchor="middle" class="s">Seller says yes; card charged</text>

  <text x="1060" y="370" text-anchor="middle" class="l b">Completed</text>
  <text x="1060" y="390" text-anchor="middle" class="m">completed</text>
  <text x="1060" y="412" text-anchor="middle" class="s">Seller finishes; seller paid</text>

  <!-- terminus labels -->
  <circle cx="478" cy="510" r="9" class="end"/>
  <text x="478" y="542" text-anchor="middle" class="b" font-size="15">Expired</text>
  <text x="478" y="562" text-anchor="middle" class="s">No seller took it, a pinned</text>
  <text x="478" y="580" text-anchor="middle" class="s">seller said no, or the payment</text>
  <text x="478" y="598" text-anchor="middle" class="s">never arrived. No charge.</text>
  <text x="478" y="618" text-anchor="middle" class="m">expired</text>

  <circle cx="690" cy="510" r="9" class="end"/>
  <text x="690" y="542" text-anchor="middle" class="b" font-size="15">Cancelled by the buyer</text>
  <text x="690" y="562" text-anchor="middle" class="s">Before a seller is locked in.</text>
  <text x="690" y="580" text-anchor="middle" class="s">No charge.</text>
  <text x="690" y="600" text-anchor="middle" class="m">cancelled</text>

  <circle cx="940" cy="510" r="9" class="end"/>
  <text x="940" y="542" text-anchor="middle" class="b" font-size="15">Cancelled by an admin</text>
  <text x="940" y="562" text-anchor="middle" class="s">After payment: the buyer</text>
  <text x="940" y="580" text-anchor="middle" class="s">gets a full refund.</text>
  <text x="940" y="600" text-anchor="middle" class="m">cancelled</text>

  <!-- legend -->
  <line x1="60" y1="680" x2="1140" y2="680" stroke="#cfc6b4" stroke-width="1"/>
  <line x1="60" y1="710" x2="110" y2="710" class="hot"/>
  <text x="124" y="715" class="s">the hoped-for trip</text>
  <line x1="300" y1="710" x2="350" y2="710" class="br"/>
  <text x="364" y="715" class="s">a way off the line</text>
  <text x="560" y="715" class="m">like_this</text>
  <text x="634" y="715" class="s">is the status name the software uses</text>
</svg>
