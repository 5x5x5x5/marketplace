[project]
name = "marketplace"
version = "0.1.0"
description = "Two-sided marketplace with platform margin set independently per side."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.1",
    "pydantic[email]>=2.14.3",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
    "sqlalchemy>=2.1.8",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.8",
    "stripe>=16.1.0",
    "pwdlib[argon2]>=0.3.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.33",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "httpx>=0.27",
    "ruff>=0.17.4",
    "pyright>=1.1.414",
    "httpx2>=2.16",
]
loadtest = [
    "locust>=2.32",
]
mcp = [
    "mcp>=2.3.0",
    "httpx>=0.27",
]

[tool.uv]
# The MCP package's tests and type-checking need the SDK; the app itself never does.
default-groups = ["dev", "mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketplace", "src/marketplace_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff >= 0.17 formats Python blocks inside Markdown; the specs and plans are kept as written.
extend-exclude = ["migrations", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
